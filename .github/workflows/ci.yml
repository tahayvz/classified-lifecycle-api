name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Verify coverage thresholds
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Summarise coverage
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          p = pathlib.Path('build/reports/jacoco/test/jacocoTestReport.xml')
          if not p.exists():
              print('Coverage report not produced.'); raise SystemExit
          root = ET.parse(p).getroot()
          def pct(t):
              for c in root.findall('counter'):
                  if c.get('type') == t:
                      m, cv = int(c.get('missed')), int(c.get('covered'))
                      return 100 * cv / (m + cv) if m + cv else 0.0
              return 0.0
          print('## Coverage\n')
          print('| Metric | Covered |')
          print('| --- | --- |')
          for t in ('INSTRUCTION', 'LINE', 'BRANCH'):
              print(f'| {t.title()} | {pct(t):.1f}% |')
          PY

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 14

  integration-tests:
    name: Integration tests (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: build/reports/tests/integrationTest
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t classified-lifecycle-api:${{ github.sha }} .

      - name: Start container and probe health
        run: |
          docker run -d --name api -p 8080:8080 classified-lifecycle-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become healthy in time." >&2
          docker logs api >&2
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f api || true
