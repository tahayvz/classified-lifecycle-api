version: '3.9'

services:
  classified-lifecycle-api:
    container_name: classified-lifecycle-api-container
    image: classified-lifecycle-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
