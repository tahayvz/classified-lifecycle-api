spring:
  application:
    name: classified-lifecycle-api

  datasource:
    url: jdbc:h2:mem:classifiedsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      # VARSAYILAN KAPALI.
      #
      # Konsol, kimlik dogrulamasi olmayan tam bir SQL kabugudur ve H2
      # `CREATE ALIAS ... AS $$ ... $$` ile calisma aninda Java derleyip
      # calistirmaya izin verir -- yani JVM icinde rastgele kod calistirma.
      # Baglanti bilgileri de bu dosyada yazili (sa / bos parola).
      #
      # Dockerfile profil vermeden calisiyor, yani varsayilan profil imajin
      # profilidir. Acik birakmak, bu imaji calistirip portu acan herkese
      # konteyner icinde kod calistirma imkani vermek demekti.
      #
      # Lokalde acmak icin: H2_CONSOLE=true
      enabled: ${H2_CONSOLE:false}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.marketplace.classifieds: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
